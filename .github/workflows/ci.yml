name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/gridwright

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine  # Docker Hub mirror: no anonymous pull limit
        env:
          POSTGRES_USER: gw
          POSTGRES_PASSWORD: gw
          POSTGRES_DB: demo
        ports: ['54329:5432']
        options: >-
          --health-cmd "pg_isready -U gw" --health-interval 5s --health-timeout 5s --health-retries 20
      mariadb:
        image: mirror.gcr.io/library/mariadb:11
        env:
          MARIADB_USER: gw
          MARIADB_PASSWORD: gw
          MARIADB_DATABASE: demo
          MARIADB_ROOT_PASSWORD: root
        ports: ['33069:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'Gridwright!2026'
          MSSQL_PID: Developer
        ports: ['14333:1433']
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Engine unit tests
        run: cargo test --manifest-path core/Cargo.toml

      - name: wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build engine → WebAssembly (browser and Node)
        run: |
          cd core
          wasm-pack build --release --target web --out-dir ../client/src/engine/pkg --out-name gridwright_core
          wasm-pack build --release --target nodejs --out-dir ../server/engine --out-name gridwright_core

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json
      - name: Build client
        run: cd client && npm ci --no-audit --no-fund && npm run build
      - name: Build server
        run: cd server && npm ci --no-audit --no-fund && npm run build

      - name: Seed the test database
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
          PGPASSWORD=gw psql -h 127.0.0.1 -p 54329 -U gw -d demo -c "CREATE TABLE orders(id serial primary key, region text, product text, amount numeric); INSERT INTO orders(region,product,amount) VALUES ('North','A',10),('South','A',20),('North','B',30),('South','B',40),('North','A',5);"

      - name: Python runtime for server-side cells (venv + bubblewrap with the installer's AppArmor recipe)
        run: |
          sudo apt-get install -y -qq bubblewrap >/dev/null
          # Ubuntu ≥ 23.10 confines unprivileged user namespaces; this is what install.sh --sandbox does
          printf 'abi <abi/4.0>,\ninclude <tunables/global>\n\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n  userns,\n\n  include if exists <local/bwrap>\n}\n' | sudo tee /etc/apparmor.d/bwrap >/dev/null
          sudo apparmor_parser -r -T -W /etc/apparmor.d/bwrap
          bwrap --ro-bind / / --tmpfs /tmp --proc /proc --dev /dev --unshare-all --die-with-parent python3 -c 'print("bwrap ok")'
          python3 -m venv /tmp/gw-py && /tmp/gw-py/bin/pip install -q pandas matplotlib
          /tmp/gw-py/bin/python -c "import pandas, matplotlib; print('pandas', pandas.__version__)"
      - name: Browser tests
        run: |
          pip install -q playwright -r integrations/companion/requirements.lock.txt && python3 -m playwright install --with-deps chromium >/dev/null
          python3 integrations/companion/investigate.py --probe
          mkdir -p /tmp/gw-inbox
          (cd server && GRIDWRIGHT_DATA=/tmp/gw-data PORT=8787 GRIDWRIGHT_PYTHON=/tmp/gw-py/bin/python GRIDWRIGHT_PYTHON_TIMEOUT_MS=5000 GRIDWRIGHT_PYTHON_QUEUE=3 GRIDWRIGHT_INBOX=/tmp/gw-inbox node dist/index.js > /tmp/server.log 2>&1 &)
          (cd server && GRIDWRIGHT_DATA=/tmp/gw-acl GRIDWRIGHT_TRUST_TAILSCALE=1 GRIDWRIGHT_ADMINS=boss@example.com GRIDWRIGHT_PYTHON=/tmp/gw-py/bin/python GRIDWRIGHT_PYTHON_USERS=alice@example.com GRIDWRIGHT_GPU_USERS=boss@example.com PORT=8795 node dist/index.js > /tmp/server-acl.log 2>&1 &)
          node e2e/mock-llm.mjs > /tmp/mock.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8787/api/health >/dev/null && curl -fsS http://127.0.0.1:8795/api/health >/dev/null && break; sleep 1; done
          python3 e2e/smoke.py http://127.0.0.1:8787 --python
          python3 e2e/features.py http://127.0.0.1:8787 --pg 127.0.0.1:54329:demo:gw:gw --mock-llm http://127.0.0.1:8899/v1
          python3 e2e/features2.py http://127.0.0.1:8787 --pg 127.0.0.1:54329:demo:gw:gw --mock-llm http://127.0.0.1:8899/v1 --acl http://127.0.0.1:8795
          python3 e2e/features3.py http://127.0.0.1:8787 --pg 127.0.0.1:54329:demo:gw:gw --acl http://127.0.0.1:8795
          python3 e2e/features4.py http://127.0.0.1:8787 --data /tmp/gw-data
          python3 e2e/ai_multiplayer.py http://127.0.0.1:8787
      - name: Reference workbooks reconcile to independently computed figures
        run: python3 e2e/reference.py http://127.0.0.1:8787
      - name: Interaction quality (drafts, overflow, document menu, Review wording, navigation, keyboard, phone)
        run: python3 e2e/interface.py http://127.0.0.1:8787 --acl http://127.0.0.1:8795
      - name: The companion (context, watches, attention gate, graph, LangGraph cycle, interpretation)
        run: python3 e2e/companion.py http://127.0.0.1:8787 --mock-llm http://127.0.0.1:8899/v1
      - name: The situation (correctable understanding, plain language, applied scope, decisions' conditions, expectations, conflicts, the investigation stack as stoppable jobs, the measures)
        run: |
          curl -fsS http://127.0.0.1:8787/api/investigation | tee /dev/stderr | grep -q '"available":true'
          python3 e2e/situation.py http://127.0.0.1:8787 --mock-llm http://127.0.0.1:8899/v1
      - name: Intake (formats, locale and identifiers, the first reading against independent figures, periods and corrections, duplicates, entities, coverage, hostile cells, monitoring failure, the inbox, the phone)
        run: python3 e2e/intake.py http://127.0.0.1:8787 --inbox /tmp/gw-inbox --pg 127.0.0.1:54329:demo:gw:gw
      - name: Crash recovery (a placement interrupted after its commit completes once from the log; concurrent placement; an investigation interrupted by a restart)
        run: python3 e2e/recovery.py --mock-llm http://127.0.0.1:8899/v1 --port 8797 --data /tmp/gw-recovery
      - name: Control gates (reviewer isolation, approval integrity, revocation, execution permissions)
        run: node e2e/controls.mjs http://127.0.0.1:8795
      - name: Worker isolation fails closed without bubblewrap
        run: |
          mkdir -p /tmp/fakebin && printf '#!/bin/sh\necho "bwrap: namespaces unavailable" >&2\nexit 1\n' > /tmp/fakebin/bwrap && chmod +x /tmp/fakebin/bwrap
          (cd server && PATH=/tmp/fakebin:$PATH GRIDWRIGHT_DATA=/tmp/gw-fc GRIDWRIGHT_PYTHON=/tmp/gw-py/bin/python PORT=8796 node dist/index.js > /tmp/server-fc.log 2>&1 & echo $! > /tmp/server-fc.pid)
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8796/api/python 2>/dev/null | grep -qv '"not probed yet"' && break; sleep 1; done
          curl -fsS http://127.0.0.1:8796/api/python | tee /dev/stderr | grep -q '"available":false' && curl -fsS http://127.0.0.1:8796/api/python | grep -q 'stays off'
          kill "$(cat /tmp/server-fc.pid)" || true
      - name: MCP and SQL policy from the command line
        run: |
          # the strongest sandbox must be the one in use on an Ubuntu 24.04 host (bubblewrap under AppArmor)
          curl -fsS http://127.0.0.1:8787/api/python | tee /dev/stderr | grep -q '"sandbox":"bwrap"' || { echo; grep -i "python" /tmp/server.log; sysctl kernel.apparmor_restrict_unprivileged_userns kernel.unprivileged_userns_clone 2>&1; ls /etc/apparmor.d | grep -iE "bwrap|unshare|userns" ; bwrap --ro-bind / / --unshare-all --die-with-parent python3 -c 'print(1)'; unshare -rn python3 -c 'print(1)'; exit 1; }
          # the MCP endpoint answers JSON-RPC without a browser, and the health endpoint reports it
          curl -fsS http://127.0.0.1:8787/api/health | grep -q '"mcp":true'
          curl -fsS -X POST http://127.0.0.1:8787/mcp -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -q '"propose_edit"'
          # a write through the REST query endpoint is refused before it reaches the database
          CONN=$(curl -fsS -X POST http://127.0.0.1:8787/api/connections -H 'content-type: application/json' \
            -d '{"name":"ci","kind":"postgres","host":"127.0.0.1","port":54329,"database":"demo","user":"gw","password":"gw","ssl":false}' | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST "http://127.0.0.1:8787/api/connections/$CONN/query" -H 'content-type: application/json' -d '{"sql":"DELETE FROM orders"}')
          test "$CODE" = 400
          curl -fsS -X DELETE "http://127.0.0.1:8787/api/connections/$CONN" >/dev/null
      - name: SQL Server driver
        run: python3 e2e/sqlserver.py http://127.0.0.1:8787 --mssql '127.0.0.1:14333:master:sa:Gridwright!2026'
      - name: MySQL driver and read-only policy (MariaDB)
        run: python3 e2e/mysql.py http://127.0.0.1:8787 --mysql 127.0.0.1:33069:demo:gw:gw
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: /tmp/gridwright-e2e
          if-no-files-found: ignore

      - name: Release tarball
        run: |
          mkdir -p /tmp/rel && cp -r . /tmp/rel/gridwright
          rm -rf /tmp/rel/gridwright/.git /tmp/rel/gridwright/core/target /tmp/rel/gridwright/client/node_modules /tmp/rel/gridwright/server/node_modules /tmp/rel/gridwright/data
          tar -C /tmp/rel -czf gridwright.tar.gz gridwright
          sha256sum gridwright.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: gridwright-release
          path: gridwright.tar.gz
      - name: Keep build outputs for the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: build-outputs
          path: |
            client/dist
            client/src/engine/pkg
            server/dist
            server/engine

  release-branch:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-outputs
      - name: Publish the prebuilt tree to the `release` branch
        run: |
          git config user.name "gridwright-ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan release-build
          git add -A
          git add -f client/dist client/src/engine/pkg server/dist server/engine
          git commit -qm "release: prebuilt from ${GITHUB_SHA::7}"
          git push -f origin HEAD:release

  image:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build-outputs
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push (linux/amd64, linux/arm64) from the prebuilt tree
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
