[package]
name = "gridwright-core"
version = "0.11.0"
edition = "2021"
description = "Spreadsheet engine for Gridwright: tables, formulas, dependency graph, ops/undo, WASM bindings"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
regex-lite = "0.1"

[profile.release]
opt-level = 2
lto = true
codegen-units = 1
